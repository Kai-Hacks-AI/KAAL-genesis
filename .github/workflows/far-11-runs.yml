# THROWAWAY, removed before this branch is proposed. Obtains the Runs for FAR-10 on each host.
name: far-11-runs
on:
  push:
    branches: [claude/project-thread-ub5lxu]
permissions:
  contents: read
jobs:
  run:
    name: far-11-run-${{ matrix.where }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - where: linux
            os: ubuntu-latest
          - where: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: a00daa92ac8dfb4a9df89deaa6e43c4d23fa79a9
          path: candidate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: candidate
      - shell: bash
        run: |
          test "$(git -C candidate rev-parse HEAD)" = a00daa92ac8dfb4a9df89deaa6e43c4d23fa79a9
          code=0
          npm run --silent environment:run -- change/far/26/10/02/03/runs/01/plan.md candidate --candidate-identity far/26/10/02/03 > run.txt || code=$?
          echo "=====BEGIN-RUN-${{ matrix.where }}====="
          cat run.txt
          echo "=====END-RUN-${{ matrix.where }}====="
          echo "exit=$code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
