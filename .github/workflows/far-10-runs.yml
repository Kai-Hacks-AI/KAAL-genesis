# THROWAWAY, removed before this branch is proposed. Obtains the Runs for FAR-10 on each host.
name: far-10-runs
on:
  push:
    branches: [claude/project-thread-w2fxq7]
permissions:
  contents: read
jobs:
  run:
    name: far-10-run-${{ matrix.where }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - where: linux
            os: ubuntu-latest
          - where: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: 0f48200daf234094d48738d646528fe9f8bde245
          path: candidate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: candidate
      - shell: bash
        run: |
          test "$(git -C candidate rev-parse HEAD)" = 0f48200daf234094d48738d646528fe9f8bde245
          code=0
          npm run --silent environment:run -- change/far/26/10/02/02/runs/01/plan.md candidate --candidate-identity far/26/10/02/02 > run.txt || code=$?
          echo "=====BEGIN-RUN-${{ matrix.where }}====="
          cat run.txt
          echo "=====END-RUN-${{ matrix.where }}====="
          echo "exit=$code"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
