# Runs the full suite, KAAL's Regression Test Plan, typecheck and format check
# on Linux and Windows. How KAAL tests: test/strategy.md. Until KAAL derives
# the current Regression Test Plan, the Plan is named here explicitly, as a
# bootstrap: the first one, which supersedes nothing. Which cases run where is
# not selected.
#
# Job names are unique across all workflows: required status checks select by
# job name alone, so they must never be ambiguous and must not change when a
# runner image does. A name is <what>, and <what>-<where> only when the
# environment is part of what the check asserts: here KAAL's tests must pass
# on Linux and on Windows. Checks that hold on any runner carry no <where>.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # One job per <where>, no orchestration jobs: the checks on a pull request
  # are exactly the ones that assert something, never skipped or cancelled
  # helpers. A push to a branch with an open pull request is covered by that
  # pull request's run, so its push-test-<where> job finishes at once after
  # its first step, without running the suite. Push runs are named
  # push-test-<where>, never test-<where>, so they cannot satisfy or muddy the
  # required checks.
  test:
    name: ${{ github.event_name == 'push' && 'push-test' || 'test' }}-${{ matrix.where }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - where: linux
            os: ubuntu-latest
          - where: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - id: covered
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # A failed lookup is treated as no open PR: an occasional duplicate
          # run is better than a branch with no push feedback.
          run=true
          if n=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$OWNER:$BRANCH" --jq length); then
            if [ "$n" -gt 0 ]; then
              run=false
              echo "::notice::Covered by the pull request run; push tests not needed."
            fi
          else
            echo "::warning::open-PR lookup failed; running push tests"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # Check out the way Git for Windows does by default, on every OS, so
      # line-ending conversion is always exercised and never assumed away.
      - if: steps.covered.outputs.run != 'false'
        run: git config --global core.autocrlf true
      - if: steps.covered.outputs.run != 'false'
        uses: actions/checkout@v7
      - if: steps.covered.outputs.run != 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.covered.outputs.run != 'false'
        run: npm ci
      - if: steps.covered.outputs.run != 'false'
        run: npm test
      - if: steps.covered.outputs.run != 'false'
        run: npm run testing:run -- change/regression-testing/26/09/30/01/test/regression.md
      - if: steps.covered.outputs.run != 'false'
        run: npm run typecheck
      - if: steps.covered.outputs.run != 'false'
        run: npm run format:check
