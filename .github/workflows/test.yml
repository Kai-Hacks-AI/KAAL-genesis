# Runs the full suite, typecheck and format check on Linux and Windows. Which
# cases run where is a Test Run concern; deciding it selectively would need a
# Test Plan, not yet needed.
#
# Job names are unique across all workflows: required status checks select by
# job name alone, so they must never be ambiguous and must not change when a
# runner image does. A name is <what>, and <what>-<where> only when the
# environment is part of what the check asserts: here KAAL's tests must pass
# on Linux and on Windows. Checks that hold on any runner carry no <where>.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test-${{ matrix.where }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - where: linux
            os: ubuntu-latest
          - where: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      # Check out the way Git for Windows does by default, on every OS, so
      # line-ending conversion is always exercised and never assumed away.
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run format:check
