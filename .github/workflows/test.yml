# Runs the full suite, the Regression Test Plan of the Change being judged,
# typecheck and format check on Linux and Windows. The Plan is named here,
# explicitly: Testing never discovers a current Plan, and Change order is not
# used to infer one. Which cases run where is not selected.
#
# Job names are <what>-<where> and unique across all workflows: required
# status checks select by job name alone, so they must never be ambiguous
# and must not change when a runner image does.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test-${{ matrix.where }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - where: linux
            os: ubuntu-latest
          - where: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      # Check out the way Git for Windows does by default, on every OS, so
      # line-ending conversion is always exercised and never assumed away.
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run testing:run -- change/regression-testing/26/09/30/01/test/regression.json
      - run: npm run typecheck
      - run: npm run format:check
