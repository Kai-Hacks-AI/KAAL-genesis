# Asks for Change Sealing: names the pull request whose Changes seal-change.yml
# should seal or verify. It is the trigger only and decides nothing.
#
# Runs as pull_request, so GitHub takes this file from the change, and a change
# may edit or delete it: that only means seal-change never reports for its
# head, which blocks it. Nothing here has a secret, a write permission or a
# checkout. The pull request's number is all it passes on, through the run
# name, and seal-change.yml, which runs from the default branch, re-derives
# everything else from GitHub and trusts nothing this file says.
name: request-seal-change

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]

run-name: pr=${{ github.event.pull_request.number }}

permissions: {}

jobs:
  request-seal-change:
    name: request-seal-change
    runs-on: ubuntu-latest
    steps:
      - run: echo "Change Sealing requested for pull request ${{ github.event.pull_request.number }}."
